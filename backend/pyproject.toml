[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sceneseek"
version = "0.2.0"
description = "Multimodal video indexing and retrieval service"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["sceneseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

