name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: python -m pytest
        working-directory: backend
      - name: Hosted demo isolation and limit tests
        run: |
          pip install gradio==6.30.0
          PYTHONPATH=backend:. python -m pytest hf_space/test_demo.py hf_space/test_fullstack.py -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sceneseek:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the non-root image and verify API and frontend
        run: |
          docker run --detach --name sceneseek-ci --publish 127.0.0.1:8000:8000 sceneseek:ci
          trap 'docker logs sceneseek-ci; docker stop sceneseek-ci >/dev/null' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          test "$(docker exec sceneseek-ci id -u)" = "10001"
          docker exec sceneseek-ci python -c "from pathlib import Path; assert Path('/data/.session-secret').stat().st_mode & 0o077 == 0"
